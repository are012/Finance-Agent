id: breakout_volume_20
name: 20-bar breakout with volume confirmation
idea: "A close above the prior 20-bar high with volume confirmation may identify short-term continuation."
strategy_family: breakout_volume
universe:
  markets: ["KOSPI", "KOSDAQ"]
  liquidity_filter:
    min_avg_traded_value: 100000
    lookback: 20
features:
  - prior_high_20
  - volume_ratio_20
  - traded_value_ma_20
entry_rule:
  description: "Enter when close breaks above the prior 20-bar high and volume is at least its 20-bar average."
  expression: "close > prior_high_20 and volume_ratio_20 >= 1.0"
exit_rule:
  description: "Exit after 3 trading bars."
  holding_period_days: 3
  stop_loss_pct: null
  take_profit_pct: null
position_sizing:
  method: equal_weight
  max_position_pct: 0.34
  max_positions: 3
cost_model:
  commission_bps: 1.5
  sell_tax_bps: 20
  slippage_bps: 5
parameters:
  lookback_bars: 20
  holding_bars: 3
  volume_ratio_min: 1.0
falsification:
  min_trades: 1
  min_validation_cagr: -1.0
  min_validation_sharpe: -10.0
  max_validation_mdd: 0.95
notes:
  - "Synthetic sample hypothesis for offline completion audit."
