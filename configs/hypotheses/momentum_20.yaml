id: momentum_20
name: Liquid 20-bar momentum continuation
idea: "Positive 20-bar chart momentum in liquid names may persist over a short holding window."
strategy_family: momentum
universe:
  markets: ["KOSPI", "KOSDAQ"]
  liquidity_filter:
    min_avg_traded_value: 100000
    lookback: 20
features:
  - momentum_20
  - traded_value_ma_20
entry_rule:
  description: "Enter when 20-bar momentum is positive after the close signal."
  expression: "momentum_20 > 0"
exit_rule:
  description: "Exit after 3 trading bars."
  holding_period_days: 3
  stop_loss_pct: null
  take_profit_pct: null
position_sizing:
  method: equal_weight
  max_position_pct: 0.34
  max_positions: 3
cost_model:
  commission_bps: 1.5
  sell_tax_bps: 20
  slippage_bps: 5
parameters:
  lookback_bars: 20
  holding_bars: 3
  min_momentum: 0.0
falsification:
  min_trades: 1
  min_validation_cagr: -1.0
  min_validation_sharpe: -10.0
  max_validation_mdd: 0.95
notes:
  - "Synthetic sample hypothesis for offline completion audit."
