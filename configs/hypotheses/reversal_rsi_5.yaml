id: reversal_rsi_5
name: 5-bar RSI mean reversion
idea: "Short-term oversold RSI may revert in liquid chart-only names."
strategy_family: rsi_mean_reversion
universe:
  markets: ["KOSPI", "KOSDAQ"]
  liquidity_filter:
    min_avg_traded_value: 100000
    lookback: 5
features:
  - rsi_5
  - traded_value_ma_5
entry_rule:
  description: "Enter when 5-bar RSI is oversold after the close signal."
  expression: "rsi_5 <= 35"
exit_rule:
  description: "Exit after 3 trading bars."
  holding_period_days: 3
  stop_loss_pct: null
  take_profit_pct: null
position_sizing:
  method: equal_weight
  max_position_pct: 0.34
  max_positions: 3
cost_model:
  commission_bps: 1.5
  sell_tax_bps: 20
  slippage_bps: 5
parameters:
  lookback_bars: 5
  holding_bars: 3
  max_rsi: 35
falsification:
  min_trades: 1
  min_validation_cagr: -1.0
  min_validation_sharpe: -10.0
  max_validation_mdd: 0.95
notes:
  - "Synthetic sample hypothesis for offline completion audit."
