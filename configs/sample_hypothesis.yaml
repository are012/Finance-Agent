id: H-SAMPLE-001
idea: "20-bar breakout with volume confirmation may capture short-term chart momentum."
family: breakout_volume
universe:
  markets: ["KOSPI", "KOSDAQ"]
  liquidity_filter:
    min_avg_traded_value: 100000
    lookback: 5
features:
  - prior_high_20
  - volume_surge_20
  - traded_value_ma_20
entry_rule:
  description: "Enter when close breaks above the prior 20-bar high and volume is above its 20-bar average."
  expression: "close > prior_high_20 and volume_surge_20 >= 0.0"
exit_rule:
  description: "Exit after 3 trading bars or risk rule trigger."
  holding_period_days: 3
  stop_loss_pct: null
  take_profit_pct: null
position_sizing:
  method: equal_weight
  max_position_pct: 0.34
  max_positions: 3
cost_model:
  commission_bps: 1.5
  sell_tax_bps: 20
  slippage_bps: 5
parameters:
  lookback_bars: 20
  holding_bars: 3
  volume_ratio_min: 1.0
falsification:
  min_trades: 1
  min_validation_cagr: -1.0
  min_validation_sharpe: -10.0
  max_validation_mdd: 0.95
notes:
  - "Synthetic sample hypothesis for offline end-to-end tests."
